services:
  server:
    build:
      context: .
      args:
        SHRIMPLY_SERVER_GIT_HASH: ${SHRIMPLY_SERVER_GIT_HASH:-}
    gpus: all
    network_mode: host
    volumes:
      - ./.docker/venv:/app/.venv
      - ./.docker/cache:/root/.cache/uv
      - ./.docker/huggingface:/root/.cache/huggingface
      - ./.docker/pneuma/models:/app/models
      - ./.docker/python:/root/.local/share/uv/python
    healthcheck:
      test: curl -fso /dev/null http://localhost:8787/
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5m
