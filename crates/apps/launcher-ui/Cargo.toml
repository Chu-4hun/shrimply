[package]
name = "shrimply-launcher-ui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "shrimply"
path = "src/main.rs"

[dependencies]
adw = { workspace = true, features = ["v1_9"] }
gtk = { workspace = true, features = ["v4_10"] }
shrimply-support = { path = "../../support" }
shrimply-project = { path = "../../project/project" }
shrimply-ui-foundation = { path = "../../ui/ui-foundation" }
tracing.workspace = true
