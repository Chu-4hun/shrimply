[package]
name = "shrimply-math-color"
version = "0.1.0"
edition = "2024"

[features]
cuda = ["dep:cuda-core"]
gdk = ["dep:gdk"]
gif = ["dep:rayon"]
skia = ["dep:skia-safe"]

[dependencies]
cuda-core = { workspace = true, optional = true }
gdk = { workspace = true, optional = true }
num-traits.workspace = true
oklab.workspace = true
rayon = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
skia-safe = { workspace = true, optional = true }
